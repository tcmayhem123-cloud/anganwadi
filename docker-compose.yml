services:
  db:
    image: postgres:16-alpine
    container_name: acgms_postgres
    environment:
      POSTGRES_USER: acgms_user
      POSTGRES_PASSWORD: acgms_secure_password
      POSTGRES_DB: acgms_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acgms_user -d acgms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: acgms_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://acgms_user:acgms_secure_password@db:5432/acgms_db
      SECRET_KEY: change-me-in-production-acgms-secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
